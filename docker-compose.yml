services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docrevive-postgres

    environment:
      POSTGRES_DB: docrevive
      POSTGRES_USER: docrevive_user
      POSTGRES_PASSWORD: docrevive_password

    ports:
      - "5434:5432"

    volumes:
      - docrevive_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


volumes:
  docrevive_postgres_data: